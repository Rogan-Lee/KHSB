name: Test

on:
  push:
    branches: [main, tmp-main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - run: npm ci

      # 루트 테스트 일부가 apps/mobile/src/lib 를 불러오고, 그 tsconfig 가 expo/tsconfig.base 를 확장한다
      - run: npm ci --ignore-scripts
        working-directory: apps/mobile

      - run: npm test
