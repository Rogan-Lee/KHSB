name: Android 빌드 (GitHub 서버)

# EAS 클라우드 대신 GitHub 서버에서 `eas build --local` 로 안드로이드를 빌드한다.
# EAS 무료 빌드 횟수를 쓰지 않고, 서명 키·버전 번호는 EAS(rogan_lee 계정)에 있는 것을 그대로 쓴다.
# 필요한 시크릿: EXPO_TOKEN, GOOGLE_SERVICES_JSON_B64(google-services.json 을 base64 로)
# — EAS 의 GOOGLE_SERVICES_JSON 은 '비밀' 변수라 EAS 서버 밖에서는 읽을 수 없어 따로 둔다.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: production = Play 업로드용 AAB, preview = 기기 확인용 APK
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ inputs.profile || 'production' }}

    steps:
      - name: 시크릿 확인
        working-directory: .
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN 시크릿이 없습니다"; exit 1; }
          [ -n "$GS" ] || { echo "::error::GOOGLE_SERVICES_JSON_B64 시크릿이 없습니다"; exit 1; }

      # React Native 안드로이드 빌드는 디스크를 많이 써서, 안 쓰는 도구를 지워 자리를 낸다
      - name: 디스크 비우기
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost; df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci

      - name: google-services.json 놓기
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$GS" | base64 -d > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      - name: 빌드
        id: build
        run: |
          OUT="$RUNNER_TEMP/khsb-android.$([ "$PROFILE" = production ] && echo aab || echo apk)"
          npx eas-cli@latest build --platform android --profile "$PROFILE" --local --non-interactive --output "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: khsb-android-${{ env.PROFILE }}-${{ github.run_number }}
          path: ${{ steps.build.outputs.path }}
          retention-days: 7
